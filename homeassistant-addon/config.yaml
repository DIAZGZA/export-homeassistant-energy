name: Energy Export
version: 1.0.0
slug: energy_export
description: Sincroniza estadísticas diarias de energía de Home Assistant en una base SQLite.
url: https://github.com/DIAZGZA/export-homeassistant-energy
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: services
boot: auto
init: false
homeassistant_api: true
map:
  - data:rw
options:
  home_assistant_url: http://supervisor/core
  start_date: "2024-01-01"
  database_file: energy_daily.sqlite
  table: daily_energy
  sync_hour: 1
  sync_minute: 0
  run_on_startup: false
  healthchecks_ping_url: ""
  solar_stat: sensor.inverter_total_yield
  consumption_stat: sensor.consumo_casa_total_energy
  grid_import_stat: sensor.power_meter_consumption
  grid_export_stat: sensor.power_meter_exported
  peak_stat: sensor.inverter_day_active_power_peak
  import_f1_stat: sensor.energia_giornaliera_casa_fascia_f1
  import_f2_stat: sensor.energia_giornaliera_casa_fascia_f2
  import_f3_stat: sensor.energia_giornaliera_casa_fascia_f3
  battery_discharge_f1_stat: sensor.cantina_marstek_venus_scarica_marstek_fasce_f1
  battery_discharge_f2_stat: sensor.cantina_marstek_venus_scarica_marstek_fasce_f2
  battery_discharge_f3_stat: sensor.cantina_marstek_venus_scarica_marstek_fasce_f3
schema:
  home_assistant_url: str
  start_date: str
  database_file: str
  table: str
  sync_hour: int(0,23)
  sync_minute: int(0,59)
  run_on_startup: bool
  healthchecks_ping_url: str?
  solar_stat: str
  consumption_stat: str
  grid_import_stat: str
  grid_export_stat: str
  peak_stat: str
  import_f1_stat: str
  import_f2_stat: str
  import_f3_stat: str
  battery_discharge_f1_stat: str
  battery_discharge_f2_stat: str
  battery_discharge_f3_stat: str